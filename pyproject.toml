[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalmint"
version = "0.1.0"
description = "Tiny explicit-likelihood generative models for edge signals: label-free anomaly detection and neural compression from one model."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SignalMint" }]
keywords = [
    "tinyml",
    "edge-ai",
    "anomaly-detection",
    "neural-compression",
    "autoregressive",
    "predictive-maintenance",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
train = [
    "torch>=2.9",
]
viz = [
    "matplotlib>=3.8",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
signalmint = "signalmint.cli:main"

[tool.setuptools.packages.find]
include = ["signalmint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["signalmint"]
